name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.18.3 --ignore-scripts
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare allowlisted PostgreSQL test binaries
        run: pnpm rebuild @embedded-postgres/linux-x64
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm test:integration
        env:
          REQUIRE_REAL_POSTGRES: 'true'
      - run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser journeys with explicit test adapters
        run: pnpm test:e2e --workers=1
      - name: Disabled beta deployment
        run: pnpm test:e2e beta.spec.ts --grep 'disabled beta routes' --workers=1
        env:
          E2E_BETA_FLAGS: 'false'
