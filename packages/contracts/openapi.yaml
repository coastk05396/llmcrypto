    GatewayErrorCode:
      type: string
      description: >
        Codes the gateway itself raises (code field of the OpenAI error / lower-cased type-less code of the Anthropic error). Failures that surface a console
        error on a /v1 path use the lower-cased console ErrorCode instead (e.g. internal, unavailable).
      enum: [context_length_exceeded, invalid_json, invalid_request, max_tokens_too_large, model_protocol_unsupported, unsupported_parameter, unsupported_value, invalid_api_key, insufficient_funds, key_spend_cap_exceeded, project_spend_cap_exceeded, insufficient_scope, model_not_allowed, project_not_permitted, model_not_found, request_too_large, estimation_unavailable, concurrency_limit_exceeded, loop_guard_blocked, rate_limit_exceeded, internal_error, protocol_not_implemented, pricing_unavailable, service_unavailable, upstream_error, upstream_timeout, client_closed_request]
    OpenAIErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message: { type: string, minLength: 1 }
            type: { type: string, enum: [authentication_error, insufficient_quota, permission_error, not_found_error, invalid_request_error, rate_limit_error, server_error] }
            param: { type: [string, 'null'] }
            code: { type: string, minLength: 1 }
    AnthropicErrorEnvelope:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string, enum: [authentication_error, billing_error, permission_error, not_found_error, invalid_request_error, request_too_large, rate_limit_error, timeout_error, api_error] }
            message: { type: string, minLength: 1 }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id: { type: string, minLength: 1 }
              object: { type: string, const: model }
              created: { type: integer }
              owned_by: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      description: Upstream-compatible request; unsupported parameters are rejected with 400 unsupported_parameter. Only the fields every protocol shares are required here.
      properties:
        model: { type: string, minLength: 1 }
        messages: { type: array, minItems: 1 }
        stream: { type: boolean }
        max_tokens: { type: integer, minimum: 1 }
