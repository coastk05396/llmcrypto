        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Design page, content: { application/json: { schema: { $ref: '#/components/schemas/DesignList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/designs/{designId}:
    get:
      operationId: getDesign
      summary: BETA. The design with every revision, its document, failure and cost. Poll while a revision is queued or generating.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: designId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Design, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDesign
      summary: BETA. Real delete of the brief, instructions and documents (owner/admin or creator). Usage and ledger rows stay (they hold no text).
      security: [{ sessionCookie: [] }]
      parameters: [{ name: designId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/designs/{designId}/revisions:
    post:
      operationId: createDesignRevision
      summary: BETA. Queue a revision of the latest proposal. baseRevision must be the latest revision (409 VERSION_CONFLICT otherwise, or while a generation is running).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: designId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDesignRevisionRequest' } } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/DesignRevisionAccepted' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/designs/{designId}/export:
    get:
      operationId: exportDesign
      summary: >
        BETA. Download a succeeded revision as an inert artifact: markdown (default, angle brackets escaped) or JSON, both labelled AI-generated.
        Served as an attachment with a sandboxing CSP. 404 when there is no succeeded revision.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: designId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [markdown, json], default: markdown } }
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Artifact, content: { text/markdown: { schema: { type: string } }, application/json: { schema: { $ref: '#/components/schemas/DesignExport' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/audit:
    get:
      operationId: listAuditEvents
      summary: Audit events of the signed-in account, newest first (owner/admin/billing). Operator actions appear with actor "operator" and no user id.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [all, operator], default: all } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Audit page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/session:
    get:
      operationId: getOperatorSession
      summary: Whether the signed-in user holds an operator grant and a live elevation for this session. Any signed-in user may ask; non-operators get isOperator false.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Operator session state, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: startOperatorSession
      summary: Elevate THIS session. Needs an operator grant and authentication within the last OPERATOR_STEP_UP_WINDOW_SECONDS (else 403 STEP_UP_REQUIRED). Lapses by itself.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Elevated, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      operationId: endOperatorSession
      summary: End this session's elevation
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/operator/reconciliation:
    get:
      operationId: getReconciliationSummary
      summary: OPERATOR. Counts of open reviews, unresolved alerts, stuck reservations, ledger mismatches and pending adjustments
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationSummary' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/operator/payment-reviews:
    get:
      operationId: listPaymentReviews
      summary: OPERATOR. Manual-review queue (open by default), oldest first, all accounts
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved], default: open } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Review page, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentReviewList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/payment-alerts:
    get:
      operationId: listPaymentAlerts
      summary: OPERATOR. Reconciliation alerts (unresolved by default)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: resolved, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Alert page, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAlertList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/payment-alerts/{id}/resolve:
    post:
      operationId: resolvePaymentAlert
      summary: OPERATOR. Mark an alert resolved with a note (audited). Does not move money.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveAlertRequest' } } } }
      responses:
        '200': { description: Resolved alert, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAlert' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/stuck-reservations:
    get:
      operationId: listStuckReservations
      summary: OPERATOR. Active holds older than the threshold that never finished (never dispatched, stale dispatch, usage pending past its deadline)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Stuck holds, content: { application/json: { schema: { $ref: '#/components/schemas/StuckReservationList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/operator/ledger-mismatches:
    get:
      operationId: listLedgerMismatches
      summary: OPERATOR. Recomputed disagreements between ledger postings and the records that claim them (empty = consistent)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Mismatches, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerMismatchList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/operator/adjustments:
    post:
      operationId: proposeAdjustment
      summary: >
        OPERATOR. Propose an append-only credit, debit or review rejection. Moves no money until a DIFFERENT operator approves. Amount bounds apply
        (> 0 and <= the server maximum). Operators cannot adjust an account they belong to.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposeAdjustmentRequest' } } } }
      responses:
        '201': { description: Pending adjustment, content: { application/json: { schema: { $ref: '#/components/schemas/Adjustment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listAdjustments
      summary: OPERATOR. Adjustments with derived status (pending, approved, rejected, expired), oldest first
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Adjustment page, content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/adjustments/{id}/approve:
    post:
      operationId: approveAdjustment
      summary: >
        OPERATOR. Approve and apply: the ledger transaction posts in the same database transaction as the decision. 403 when the approver is the proposer,
        409 when already decided or expired, 409 INSUFFICIENT_FUNDS for a debit the balance cannot cover.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecideAdjustmentRequest' } } } }
      responses:
        '200': { description: Approved adjustment, content: { application/json: { schema: { $ref: '#/components/schemas/Adjustment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/operator/adjustments/{id}/reject:
    post:
      operationId: rejectAdjustment
      summary: OPERATOR. Decline a proposal (also needs an operator other than the proposer). No money moves.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecideAdjustmentRequest' } } } }
      responses:
        '200': { description: Rejected adjustment, content: { application/json: { schema: { $ref: '#/components/schemas/Adjustment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/models:
    get:
      operationId: listModels
      summary: >
        OpenAI-compatible model discovery. Public like the reference; an Authorization header, when present, must be a live key with the gateway:invoke scope
        (401/403 otherwise) and its model allowlist narrows the list. Upstream-compatible shape: the console ErrorEnvelope does NOT apply under /v1.
      security: [{}, { bearerKey: [] }]
      responses:
        '200': { description: Model list, content: { application/json: { schema: { $ref: '#/components/schemas/ModelList' } } } }
        '401': { $ref: '#/components/responses/OpenAIError' }
        '403': { $ref: '#/components/responses/OpenAIError' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: >
        OpenAI-compatible chat completion (stream and non-stream), metered: the maximum cost is held before the provider is called and settled from verified usage.
        Errors use the OpenAI error shape. Unsupported parameters are rejected (400 unsupported_parameter), never ignored.
      security: [{ bearerKey: [] }, { apiKeyHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatCompletionRequest' } } } }
      responses:
        '200': { description: Completion (JSON) or an SSE stream; shapes follow the upstream protocol, content: { application/json: { schema: { type: object } }, text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/OpenAIError' }
        '401': { $ref: '#/components/responses/OpenAIError' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '403': { $ref: '#/components/responses/OpenAIError' }
        '404': { $ref: '#/components/responses/OpenAIError' }
        '413': { $ref: '#/components/responses/OpenAIError' }
        '422': { $ref: '#/components/responses/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIError' }
        '500': { $ref: '#/components/responses/OpenAIError' }
        '502': { $ref: '#/components/responses/OpenAIError' }
        '503': { $ref: '#/components/responses/OpenAIError' }
        '504': { $ref: '#/components/responses/OpenAIError' }
  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses-compatible endpoint (stream and non-stream, function tools passthrough). Same metering and error shape as chat completions.
      security: [{ bearerKey: [] }, { apiKeyHeader: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatCompletionRequest' } } } }
      responses:
        '200': { description: Response (JSON) or an SSE stream, content: { application/json: { schema: { type: object } }, text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/OpenAIError' }
        '401': { $ref: '#/components/responses/OpenAIError' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '403': { $ref: '#/components/responses/OpenAIError' }
        '404': { $ref: '#/components/responses/OpenAIError' }
        '413': { $ref: '#/components/responses/OpenAIError' }
        '422': { $ref: '#/components/responses/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIError' }
        '500': { $ref: '#/components/responses/OpenAIError' }
        '502': { $ref: '#/components/responses/OpenAIError' }
        '503': { $ref: '#/components/responses/OpenAIError' }
        '504': { $ref: '#/components/responses/OpenAIError' }
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic-compatible messages endpoint (stream and non-stream), metered like chat completions. Errors use the Anthropic error shape.
      security: [{ apiKeyHeader: [] }, { bearerKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatCompletionRequest' } } } }
      responses:
        '200': { description: Message (JSON) or an SSE stream, content: { application/json: { schema: { type: object } }, text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/AnthropicError' }
        '401': { $ref: '#/components/responses/AnthropicError' }
        '402': { $ref: '#/components/responses/AnthropicError' }
        '403': { $ref: '#/components/responses/AnthropicError' }
        '404': { $ref: '#/components/responses/AnthropicError' }
        '413': { $ref: '#/components/responses/AnthropicError' }
        '422': { $ref: '#/components/responses/AnthropicError' }
        '429': { $ref: '#/components/responses/AnthropicError' }
        '500': { $ref: '#/components/responses/AnthropicError' }
        '502': { $ref: '#/components/responses/AnthropicError' }
        '503': { $ref: '#/components/responses/AnthropicError' }
        '504': { $ref: '#/components/responses/AnthropicError' }
  /v1beta/models/{target}:
    post:
      operationId: generateContentNotImplemented
      summary: Gemini generateContent is NOT implemented; every call answers 501 protocol_not_implemented (the catalog may still list a sample model for it).
      parameters: [{ name: target, in: path, required: true, schema: { type: string } }]
      responses:
        '501': { $ref: '#/components/responses/OpenAIError' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: session }
    bearerKey: { type: http, scheme: bearer, description: 'Gateway API key (sk_...) with the gateway:invoke scope' }
    apiKeyHeader: { type: apiKey, in: header, name: x-api-key }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Printable ASCII, 8-255 chars. Same key+payload replays; changed payload 409 IDEMPOTENCY_CONFLICT; in flight 409 IN_PROGRESS.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: '^[\x21-\x7e]+$' }
    Cursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 512 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    OpenAIError:
      description: OpenAI-shaped error
      content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIErrorEnvelope' } } }
    AnthropicError:
      description: Anthropic-shaped error
      content: { application/json: { schema: { $ref: '#/components/schemas/AnthropicErrorEnvelope' } } }
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Rate limited
      headers: { Retry-After: { required: true, schema: { type: integer, minimum: 0 } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Id: { type: string, minLength: 1, maxLength: 128 }
    Timestamp: { type: string, format: date-time, description: UTC RFC 3339 }
    AtomicAmount: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: Non-negative integer decimal string }
    Microusd: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: Micro-USD integer decimal string (six fractional USD digits) }
    SignedMicrousd: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
    ErrorCode:
      type: string
      enum: [BAD_REQUEST, IDEMPOTENCY_KEY_REQUIRED, UNAUTHENTICATED, CHALLENGE_INVALID, FORBIDDEN, STEP_UP_REQUIRED, NOT_FOUND, FEATURE_DISABLED, IDEMPOTENCY_CONFLICT, IN_PROGRESS, IDENTITY_CONFLICT, LAST_AUTH_METHOD, VERSION_CONFLICT, INSUFFICIENT_FUNDS, PAYLOAD_TOO_LARGE, VALIDATION_FAILED, RATE_LIMITED, INTERNAL, UPSTREAM_ERROR, UNAVAILABLE, UPSTREAM_TIMEOUT]
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, minLength: 1 }
            requestId: { type: string, minLength: 1 }
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, message]
                additionalProperties: false
                properties: { field: { type: string, minLength: 1 }, message: { type: string, minLength: 1 } }
    WalletChallengeRequest:
      type: object
      required: [protocol, address, chainId]
      additionalProperties: false
      properties:
        protocol: { type: string, enum: [evm, tron] }
        address: { type: string, minLength: 1, maxLength: 128 }
        chainId: { type: string, minLength: 1, maxLength: 64 }
        purpose: { type: string, enum: [login, link], description: 'Default login. link requires a current session.' }
    WalletChallenge:
      type: object
      required: [challengeId, message, expiresAt]
      additionalProperties: false
      properties:
        challengeId: { $ref: '#/components/schemas/Id' }
        message: { type: string, minLength: 1 }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    WalletSessionRequest:
      type: object
      required: [challengeId, signature]
      additionalProperties: false
      properties:
        challengeId: { $ref: '#/components/schemas/Id' }
        signature: { type: string, minLength: 1, maxLength: 2048 }
    SessionView:
      type: object
      required: [user, account, membership, expiresAt]
      additionalProperties: false
      properties:
        user:
          type: object
          required: [id, createdAt]
          additionalProperties: false
          properties: { id: { $ref: '#/components/schemas/Id' }, createdAt: { $ref: '#/components/schemas/Timestamp' } }
        account:
          type: object
          required: [id, name]
          additionalProperties: false
          properties: { id: { $ref: '#/components/schemas/Id' }, name: { type: [string, 'null'] } }
        membership:
          type: object
          required: [id, accountId, userId, role]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/Id' }
            accountId: { $ref: '#/components/schemas/Id' }
            userId: { $ref: '#/components/schemas/Id' }
            role: { type: string, enum: [owner, admin, billing, member] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        sessionKind: { $ref: '#/components/schemas/SessionKind' }
        restricted: { type: boolean }
    SessionKind: { type: string, enum: [wallet, password, telegram, api_key] }
    LinkedIdentity:
      type: object
      required: [id, protocol, address, chainPolicy, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        protocol: { type: string, enum: [evm, tron] }
        address: { type: string, minLength: 1 }
        chainPolicy: { type: string, minLength: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    IdentityList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LinkedIdentity' } }
    CatalogModel:
      type: object
      required: [id, provider, displayName, protocols, inputMicrousdPerMtok, cachedInputMicrousdPerMtok, outputMicrousdPerMtok, contextWindowTokens, updatedAt, source]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        provider: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        protocols:
          type: array
          minItems: 1
          items: { type: string, enum: [openai_chat, openai_responses, anthropic_messages, gemini_generate_content] }
        inputMicrousdPerMtok: { $ref: '#/components/schemas/Microusd' }
        cachedInputMicrousdPerMtok: { oneOf: [{ $ref: '#/components/schemas/Microusd' }, { type: 'null' }] }
        outputMicrousdPerMtok: { $ref: '#/components/schemas/Microusd' }
        contextWindowTokens: { $ref: '#/components/schemas/AtomicAmount' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
