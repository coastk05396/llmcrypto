openapi: 3.1.0
info:
  title: LLM Gateway console API
  version: draft-0.5
  description: >
    Snapshot of SPEC.md "Shared contract snapshot: draft-0.3". Zod schemas in src/ are the
    executable source; tests/contracts/schema.test.ts keeps both in agreement with the fixtures.
    /v1/* routes keep upstream-compatible request/response shapes (documented here at the level the gateway guarantees) and their own error envelopes; the console ErrorEnvelope applies only under /api.
servers:
  - url: /
tags:
  - name: console
paths:
  /api/auth/wallet/challenges:
    post:
      operationId: createWalletChallenge
      summary: >
        Create a single-use sign-in challenge (public, origin restricted, rate limited). For purpose=login the response also sets an HttpOnly, SameSite=Strict
        cookie wc_{challengeId} (Path=/api/auth/wallet/sessions, lives as long as the challenge). The browser must send it back when creating the session
        (fetch with credentials); without it the session is refused with CHALLENGE_INVALID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WalletChallengeRequest' } } } }
      responses:
        '201': { description: Challenge, content: { application/json: { schema: { $ref: '#/components/schemas/WalletChallenge' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/wallet/sessions:
    post:
      operationId: createWalletSession
      summary: Verify signature, consume challenge (requires the wc_{challengeId} cookie issued with it), set Secure HttpOnly SameSite session cookie
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WalletSessionRequest' } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/session:
    get:
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session view, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error' }
  /api/identities:
    get:
      operationId: listIdentities
      summary: Linked wallet identities of the signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Identities, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityList' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: linkIdentity
      summary: Link a new wallet using a purpose=link challenge plus its signature (current session, recent sign-in). Never merges accounts.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WalletSessionRequest' } } } }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/LinkedIdentity' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/identities/{id}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink a wallet (recent sign-in). 409 LAST_AUTH_METHOD when it is the last one.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/password/signup:
    post:
      operationId: signupPassword
      summary: Create an account with username + password (argon2id). Returns the session and single-use recovery codes, shown once.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSetupRequest' } } } }
      responses:
        '201': { description: Account, session cookie and recovery codes, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSignupResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/sessions:
    post:
      operationId: createPasswordSession
      summary: Password sign-in. Every failure (unknown user, wrong password, locked) is the same generic 401 until the attempt limit, then 429.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSessionRequest' } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/recovery:
    post:
      operationId: recoverPassword
      summary: Spend one recovery code to set a new password; revokes all sessions. Email recovery is BLOCKED (no provider).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' } } } }
      responses:
        '204': { description: Password changed; sign in again }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password:
    post:
      operationId: linkPassword
      summary: Add a password to the signed-in user (existing session, recent sign-in, not an API-key session). Returns recovery codes once.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSetupRequest' } } } }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: unlinkPassword
      summary: Remove the password (recent sign-in). 409 LAST_AUTH_METHOD when it is the last method. Revokes sessions it created.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Invalidate old recovery codes and issue a fresh set once (recent sign-in).
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: New codes, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodes' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/auth/telegram/codes:
    post:
      operationId: createTelegramCode
      summary: Issue a single-use code to send to the Telegram bot. link and step_up need a session; login is public and rate limited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCodeRequest' } } } }
      responses:
        '201': { description: Code, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/telegram/sessions:
    post:
      operationId: createTelegramSession
      summary: Verify a login code through the TelegramBot port; consumes it exactly once. Unknown Telegram ids create an account.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramVerifyRequest' } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/telegram/identities:
    post:
      operationId: linkTelegram
      summary: Link the Telegram account that sent a purpose=link code (existing session, recent sign-in). Never merges accounts.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramVerifyRequest' } } } }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramIdentity' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/telegram/identities/{id}:
    delete:
      operationId: unlinkTelegram
      summary: Unlink Telegram (recent sign-in); revokes sessions it created. 409 LAST_AUTH_METHOD when last.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/key-sessions:
    post:
      operationId: createKeySession
      summary: Restricted console session from an API key with usage:read. Only that key's own usage; no secrets, identity or security changes, no key management, no exports.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KeySessionRequest' } } } }
      responses:
        '200': { description: Restricted session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/methods:
    get:
      operationId: getAuthMethods
      summary: Every sign-in method of the signed-in user (not available to API-key sessions).
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Methods, content: { application/json: { schema: { $ref: '#/components/schemas/AuthMethods' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/session/renew:
    post:
      operationId: renewSession
      summary: Rotate the cookie token and extend expiry up to the absolute session lifetime. Does not refresh step-up.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Renewed session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/session/step-up:
    post:
      operationId: stepUp
      summary: Re-prove a non-wallet method ({password} or Telegram {codeId}) so privileged mutations are allowed again. Wallet sessions sign in again.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StepUpRequest' } } } }
      responses:
        '204': { description: Step-up recorded }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/catalog:
    get:
      operationId: getCatalog
      summary: Public catalog with pricing version; no provider credentials
      parameters:
        - { name: provider, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: Catalog, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogResponse' } } } }
  /api/accounts/current/balance:
    get:
      operationId: getBalance
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Balance (account member), content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/keys:
    post:
      operationId: createKey
      summary: Create a scoped key (owner/admin, recent sign-in). Secret shown once.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateKeyRequest' } } } }
      responses:
        '201': { description: Key, content: { application/json: { schema: { $ref: '#/components/schemas/CreateKeyResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listKeys
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Key metadata page, content: { application/json: { schema: { $ref: '#/components/schemas/KeyList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/keys/{id}:
    delete:
      operationId: revokeKey
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/deposits:
    post:
      operationId: createDeposit
      summary: Create a deposit intent (owner/billing)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDepositRequest' } } } }
      responses:
        '201': { description: Deposit intent, content: { application/json: { schema: { $ref: '#/components/schemas/Deposit' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listDeposits
      summary: List deposit intents of the current account (owner/billing)
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Deposit page, content: { application/json: { schema: { $ref: '#/components/schemas/DepositList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/deposits/networks:
    get:
      operationId: listPaymentNetworks
      summary: Configured (network, asset) pairs; items is empty when no payment networks are configured (owner/billing)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Configured pairs, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentNetworkList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/deposits/{id}:
    get:
      operationId: getDeposit
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Intent, confirmation and credit status, content: { application/json: { schema: { $ref: '#/components/schemas/Deposit' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/usage:
    get:
      operationId: listUsage
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: model, in: query, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: keyId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequestState' } }
        - { name: runId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Usage page (granted projects only), content: { application/json: { schema: { $ref: '#/components/schemas/UsagePage' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/usage/{id}:
    get:
      operationId: getUsageDetail
      summary: Authorized request detail with frozen rates and customer ledger postings; accepts usage or request id
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Request detail, content: { application/json: { schema: { $ref: '#/components/schemas/UsageDetail' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/usage/agent-runs:
    get:
      operationId: listAgentRuns
      summary: Requests grouped by X-Run-Id and project. Requests with no run id are one unknown bucket per project.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: keyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Run groups, content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/ledger:
    get:
      operationId: listLedger
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/LedgerKind' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Ledger page (billing role), content: { application/json: { schema: { $ref: '#/components/schemas/LedgerPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/exports:
    post:
      operationId: createExport
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExportRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ExportAccepted' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/jobs/{id}:
    get:
      operationId: getJob
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Job status, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/jobs/{id}/download:
    get:
      operationId: downloadJob
      summary: Export file (CSV or JSONL) for a succeeded, unexpired job owned by the caller. 404 after expiry.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: File, content: { text/csv: { schema: { type: string } }, application/x-ndjson: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects/{id}/memories:
    post:
      operationId: createMemory
      summary: Create a note at version 1 (owner/admin/member, explicit storage consent). expectedVersion, if sent, must be 0. GET lists notes.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMemoryRequest' } } } }
      responses:
        '201': { description: Note, content: { application/json: { schema: { $ref: '#/components/schemas/Memory' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listMemories
      summary: Unexpired notes of the project, oldest first (owner/admin/member)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Note page, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryList' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/projects:
    post:
      operationId: createProject
      summary: Create a project (owner/admin). Names are unique per account, case-insensitively.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } } }
      responses:
        '201': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listProjects
      summary: Projects of the signed-in account (names only; any role)
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
